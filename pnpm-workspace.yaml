packages:
  - .
  - frontend

# WHY: The release-age window leaves time for a compromised package to be identified.
minimumReleaseAge: 10080

# WHY: Keep the previous pnpm major's opt-in policy for dependency build scripts.
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true

overrides:
  'qs@<6.16.0': '6.16.0'
  'path-to-regexp@8.3.0': '8.4.0'
  'nanoid@<3.3.18': '3.3.18'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
