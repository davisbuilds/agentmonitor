packages:
  - .
  - frontend

# Supply-chain quarantine: refuse package versions published in the last 7 days.
# For an urgent fix, list the package under minimumReleaseAgeExclude and remove
# it once the release ages past the window.
minimumReleaseAge: 10080

# GHSA-27r3-jxmh-p828: qualified urgent parser fix, exact release only.
# Ops owns removal after 2026-10-29T11:39:38.614Z (normal seven-day eligibility).
minimumReleaseAgeExclude:
  - 'body-parser@2.4.0'

# pnpm 10 skipped every build script not listed in onlyBuiltDependencies;
# false keeps that behavior under pnpm 11's strictDepBuilds.
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true

overrides:
  'qs@<6.16.0': '6.16.0'
  'path-to-regexp@8.3.0': '8.4.0'
  'nanoid@<3.3.18': '3.3.18'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
