<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
  <title id="title">AgentMonitor (amon)</title>
  <desc id="desc">An instrument screen where a signal trace passes two faint earlier spikes, then rises into a bright peak shaped like the letter A and ends at a live dot, beside the AgentMonitor wordmark.</desc>
  <!-- Instrument Console tokens (frontend/src/app.css) as sRGB: canvas #080c0f,
       surface #101419, line #292e34, text #f2f2f2, text-muted #b3b8be,
       accent #00abed. The A peak shares its geometry with frontend/public/favicon.svg. -->
  <rect x="1" y="1" width="878" height="238" rx="12" fill="#080c0f" stroke="#292e34" stroke-width="2"/>

  <!-- Instrument screen with graticule -->
  <rect x="32" y="28" width="360" height="184" rx="10" fill="#101419" stroke="#292e34" stroke-width="2"/>
  <g stroke="#292e34" stroke-width="1" opacity="0.75">
    <path d="M72 29V211M112 29V211M152 29V211M192 29V211M232 29V211M272 29V211M312 29V211M352 29V211"/>
    <path d="M33 76H391M33 116H391M33 156H391M33 196H391"/>
  </g>

  <!-- Signal: earlier activity (dimmed), the A peak (now), live dot -->
  <path d="M165 156L212 56L259 156Z" fill="#00abed" opacity="0.12"/>
  <g fill="none" stroke="#00abed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 156H62L76 127L90 156H94L118 104L142 156H148" stroke-opacity="0.4"/>
    <path d="M150 156H165L212 56L259 156H344"/>
    <path d="M186 118H238"/>
  </g>
  <circle cx="362" cy="156" r="8" fill="#00abed"/>

  <!-- Wordmark -->
  <path d="M424 64V176" stroke="#292e34" stroke-width="2"/>
  <text x="456" y="122" textLength="388" lengthAdjust="spacingAndGlyphs" fill="#f2f2f2" font-family="'Mona Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="600">AgentMonitor</text>
  <path d="M458 154H498" stroke="#00abed" stroke-width="4" stroke-linecap="round"/>
  <text x="514" y="161" fill="#b3b8be" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" letter-spacing="1.5">amon</text>
</svg>
